<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 628" width="970" height="628" role="img" aria-labelledby="t d">
<title id="t">WikiGuard architecture</title>
<desc id="d">Wikimedia&#x27;s stream feeds the ingestor, which publishes edits to Redpanda. The scorer scores them into Postgres on Supabase; the archiver writes every topic to a parquet archive; the labeler turns revert tags into labels. Continuous training reads the archive and promotes models in the DagsHub registry, which the scorer and the FastAPI service on Render load. A patroller reaches one Cloudflare Worker address, which sends /api to Render and pages to the Next.js app on Vercel. Explain calls an LLM.</desc>
