# kind only: a stand-in for Discord and Healthchecks.io, so Alertmanager's delivery is tested end to
# end with no real webhook. It keeps the last 200 requests and shows them at GET /received.
# scripts/kind_cluster.py points the wikiguard-alerting Secret's two URLs here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: monitoring
data:
  sink.py: |
    import json
    from collections import deque
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    received = deque(maxlen=200)

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            try:
                payload = json.loads(body)
            except ValueError:
                payload = body.decode("utf-8", "replace")
            received.append({"path": self.path, "payload": payload})
            self.send_response(204)
            self.end_headers()

        def do_GET(self):
            data = json.dumps(list(received)).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-sink }
  template:
    metadata:
      labels: { app: alert-sink }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sink
          image: python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
          command: [python, /app/sink.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - name: app
          configMap: { name: alert-sink }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector: { app: alert-sink }
  ports:
    - port: 8080
