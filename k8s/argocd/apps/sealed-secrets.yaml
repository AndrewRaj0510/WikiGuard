# The controller that turns the SealedSecrets in k8s/secrets into Secrets. First (wave -2), so
# the secrets exist before anything that reads them. Its key is backed up by the owner: a rebuilt
# cluster restores it, or every sealed file would have to be sealed again (k8s/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { cpu: 200m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
