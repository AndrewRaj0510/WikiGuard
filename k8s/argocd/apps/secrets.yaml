# The sealed secrets themselves: encrypted to the cluster's own key, so they're safe in a public
# repo. Only the controller in this cluster can open them. Wave -1: after the controller, before
# the apps that read them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/AndrewRaj0510/WikiGuard.git
    targetRevision: main
    path: k8s/secrets/prod
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Never delete a Secret because a file went missing: that would stop the app.
      prune: false
      selfHeal: true
