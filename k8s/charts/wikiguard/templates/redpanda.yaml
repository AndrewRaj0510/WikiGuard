{{- if .Values.redpanda.enabled }}
{{- /*
One Redpanda broker, Kafka API on 9092. Nothing in it needs a backup: the stream can be refilled
from Wikipedia (section 14), so a single node with a small disk is enough.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
    {{- include "wikiguard.selector" "redpanda" | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "wikiguard.selector" "redpanda" | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
    - name: admin
      port: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
    {{- include "wikiguard.selector" "redpanda" | nindent 4 }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      {{- include "wikiguard.selector" "redpanda" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wikiguard.selector" "redpanda" | nindent 8 }}
    spec:
      serviceAccountName: wikiguard-redpanda
      automountServiceAccountToken: false
      priorityClassName: wikiguard-critical
      securityContext:
        {{- include "wikiguard.podSecurity" (dict "user" 101) | nindent 8 }}
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "wikiguard.containerSecurity" . | nindent 12 }}
          # Run the binary directly: the image's entrypoint script writes into /etc/redpanda,
          # which is read-only here. --overprovisioned because it shares a small VM.
          command: [rpk, redpanda, start]
          args:
            - --mode=dev-container
            - --smp=1
            - --memory={{ .Values.redpanda.memory }}
            - --overprovisioned
            - --config=/config/redpanda.yaml
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda:33145
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.redpanda.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.redpanda }}
{{- end }}
