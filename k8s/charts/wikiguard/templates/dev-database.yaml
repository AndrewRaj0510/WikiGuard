{{- if .Values.devDatabase.enabled }}
{{- /*
kind only: Postgres in the cluster, in place of Supabase, and a Job that migrates it and makes a
login for each role, as Compose does. The logins and roles are the real least-privilege ones, so a
missing grant fails here before it fails in production.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "wikiguard.selector" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wikiguard-postgres
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
    {{- include "wikiguard.selector" "postgres" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wikiguard.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wikiguard.selector" "postgres" | nindent 8 }}
    spec:
      serviceAccountName: wikiguard-postgres
      automountServiceAccountToken: false
      # The alpine image's postgres user is 70. Started as that user, so no root step is needed.
      securityContext:
        {{- include "wikiguard.podSecurity" (dict "user" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.devDatabase.image }}
          securityContext:
            {{- include "wikiguard.containerSecurity" . | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: wikiguard
            - name: POSTGRES_DB
              value: wikiguard
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wikiguard-postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, wikiguard, -d, wikiguard]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, wikiguard, -d, wikiguard]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wikiguard-postgres
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wikiguard-migrate
  labels:
    {{- include "wikiguard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # Postgres may still be starting: each retry waits longer.
  backoffLimit: 8
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "wikiguard.selector" "migrate" | nindent 8 }}
        wikiguard.dev/database: "true"
    spec:
      serviceAccountName: wikiguard-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "wikiguard.podSecurity" dict | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "wikiguard.image" (list . "migrate") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "wikiguard.containerSecurity" . | nindent 12 }}
          command:
            - sh
            - -ec
            - alembic -c jobs/migrate/alembic.ini upgrade head && python jobs/migrate/create_local_logins.py
          envFrom:
            - secretRef:
                name: wikiguard-migrate
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
