{{- /*
The long-running workers. One replica each: the ingestor holds one stream position, and the
scorer and archiver share their consumer groups. Recreate, so two copies never hold the same
volume or stream at once during an update.
*/}}
{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: wikiguard-{{ $name }}
  labels:
    {{- include "wikiguard.labels" $ | nindent 4 }}
    {{- include "wikiguard.selector" $name | nindent 4 }}
spec:
  selector:
    {{- include "wikiguard.selector" $name | nindent 4 }}
  ports:
    - name: ops
      port: 8000
      targetPort: ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikiguard-{{ $name }}
  labels:
    {{- include "wikiguard.labels" $ | nindent 4 }}
    {{- include "wikiguard.selector" $name | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "wikiguard.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wikiguard.selector" $name | nindent 8 }}
        {{- range $worker.egress }}
        wikiguard.dev/{{ . }}: "true"
        {{- end }}
        wikiguard.dev/scraped: "true"
      annotations:
        # A changed setting restarts the pod, so it never runs with stale config.
        checksum/config: {{ toJson $.Values.config | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: wikiguard-{{ $name }}
      automountServiceAccountToken: false
      priorityClassName: wikiguard-{{ $worker.priority | default "critical" }}
      # Long enough for a final flush and offset commit after SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "wikiguard.podSecurity" dict | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "wikiguard.image" (list $ $worker.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "wikiguard.containerSecurity" $ | nindent 12 }}
          envFrom:
            {{- include "wikiguard.envFrom" $name | nindent 12 }}
          {{- with $worker.env }}
          env:
            {{- include "wikiguard.env" . | nindent 12 }}
          {{- end }}
          ports:
            - name: ops
              containerPort: 8000
          {{- if $worker.startupSeconds }}
          startupProbe:
            httpGet:
              path: /health
              port: ops
            periodSeconds: 10
            failureThreshold: {{ div $worker.startupSeconds 10 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: ops
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: ops
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "wikiguard.volumeMounts" ($worker.volumes | default list) | nindent 12 }}
      volumes:
        {{- include "wikiguard.volumes" ($worker.volumes | default list) | nindent 8 }}
{{- end }}
{{- end }}
