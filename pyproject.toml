# Tool settings for the whole repo. Each package and service has its own dependencies.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results, and test values aren't real secrets.
"**/tests/**" = ["S101", "S105", "S106", "S608"]
# Identifiers here come from constants in the migration itself, never from input.
"jobs/migrate/migrations/**" = ["S608"]
"jobs/conftest.py" = ["S101", "S608"]
# Column lists and conditions are constants here. Every value goes through a query parameter.
"services/api/wikiguard_api/**" = ["S608"]
"services/api/api_test_helpers.py" = ["S101", "S105", "S106"]
"scripts/tune_queries.py" = ["S608"]
# Local throwaway database only, and the only value in its SQL is one the script just read from it.
"scripts/compose_e2e.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
# Lets mypy understand pydantic models, including settings filled from the environment.
plugins = ["pydantic.mypy"]

# pyarrow ships no type information.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Training and serving libraries aren't installed in the main environment (F-049), so these
# two modules can't be fully checked there. Everything else in wikiguard_core stays strict.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "mlflow", "mlflow.*", "onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wikiguard_core.models", "wikiguard_core.tracking", "wikiguard_core.inference"]
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages", "services", "jobs", "tests"]
# Repo tools in scripts/ aren't an installed package, but their logic still gets tested.
pythonpath = [
    "scripts",
    "services/ingestor",
    "services/archiver",
    "services/scorer",
    "services/api",
    "jobs/labeler",
    "jobs/retrain_poller",
    "jobs/monitor",
    "jobs/purge",
    "jobs/retention",
    "jobs",
    "jobs/trainer",
]
markers = ["integration: needs real Postgres or Redpanda, and skips itself when they are not set"]
