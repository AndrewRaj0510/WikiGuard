# Minimal CI from the first commit. It grows in Phase 6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo, so a compromised step can't change it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs because tags can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Migrations, roles, RLS on every table, and the jobs, on real Postgres.
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: wikiguard
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: wikiguard
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wikiguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wikiguard:ci-only-not-a-secret@127.0.0.1:5433/wikiguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m integration

  # The Next.js app (Phase 4): contract, lint, types, unit tests, build, secrets in the bundle,
  # page budgets, end-to-end with the API mocked in the browser (XSS corpus, axe, keyboard), and
  # Lighthouse. Nothing here reaches Wikimedia, an LLM, or a real API.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
        working-directory: .
      - name: The committed API schema matches the API's code
        run: python scripts/export_openapi.py --check
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: The frontend's types match the schema (contract drift fails here)
        run: npm run types && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secrets in the client bundle, and each page within its JavaScript budget
        run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - name: End to end, the XSS corpus, axe, and the keyboard flow
        run: npm run test:e2e
      - name: Lighthouse budgets
        run: npx lhci autorun

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan the full history, because a secret stays exposed after a later commit removes it.
          fetch-depth: 0
      - name: Download gitleaks and verify its checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - run: ./gitleaks git . --redact --exit-code 1
