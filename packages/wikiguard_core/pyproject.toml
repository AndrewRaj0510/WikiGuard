[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiguard-core"
version = "0.1.0"
description = "Shared code for WikiGuard services and jobs"
requires-python = ">=3.11,<3.12"
dependencies = ["httpx>=0.28,<1", "pydantic-settings>=2.16,<3"]

# Each service installs only what it uses, so serving images stay small and free of PyTorch.
[project.optional-dependencies]
kafka = ["confluent-kafka>=2.16,<3"]
archive = ["pyarrow>=26,<27"]
db = ["psycopg[binary]>=3.3,<4"]
ops = ["prometheus-client>=0.26,<1"]
# Scoring with an exported model. Serving images install this, and never PyTorch.
serve = ["numpy>=2,<3", "onnxruntime>=1.31,<2", "tokenizers>=0.21,<1"]
# Training only: everything serving must never need. PyTorch's GPU build comes from its own index,
# so the exact pins stay in jobs/trainer/requirements.txt.
train = [
    "numpy>=2,<3",
    "torch>=2.14,<3",
    "transformers>=5.22,<6",
    "mlflow-skinny==3.5.1",
    "safetensors>=0.8,<1",
    "onnx>=1.23,<2",
    "onnxscript>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["wikiguard_core*"]

[tool.setuptools.package-data]
wikiguard_core = ["py.typed"]
