# Run from the repo root: alembic -c jobs/migrate/alembic.ini upgrade head
# The connection string comes from DATABASE_MIGRATIONS_URL, in the environment or .env, never
# from this file.
[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
