default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Scans staged changes for secrets before they reach a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Notebook outputs can hold secrets, vandal text, and large images.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Models and datasets belong in DagsHub, not git.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]

  # A changed requirements.in without its regenerated lock would fail CI. Reads files only.
  - repo: local
    hooks:
      - id: lock-requirements
        name: lock files match their .in files
        entry: python scripts/lock_requirements.py --check
        language: system
        pass_filenames: false
        files: requirements.*\.(in|txt)$
